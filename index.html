<!-- ==================================================
     パスワード認証
================================================== -->

<script>

const SITE_PASSWORD = "FCABIES2026";

const passwordScreen =
    document.getElementById("passwordScreen");

const siteContent =
    document.getElementById("siteContent");

const passwordInput =
    document.getElementById("sitePassword");

const passwordButton =
    document.getElementById("passwordButton");

const passwordError =
    document.getElementById("passwordError");


/* 初回アクセス時 */

if (
    sessionStorage.getItem("fcAbiesAuthenticated")
    === "true"
) {

    passwordScreen.style.display = "none";

    siteContent.style.display = "block";

} else {

    passwordScreen.style.display = "flex";

    siteContent.style.display = "none";

}


/* パスワード確認 */

function checkPassword() {

    const enteredPassword =
        passwordInput.value;

    if (
        enteredPassword
        === SITE_PASSWORD
    ) {

        sessionStorage.setItem(
            "fcAbiesAuthenticated",
            "true"
        );

        passwordScreen.style.display =
            "none";

        siteContent.style.display =
            "block";

    } else {

        passwordError.style.display =
            "block";

        passwordInput.value = "";

        passwordInput.focus();

    }

}


/* ボタン */

passwordButton.addEventListener(
    "click",
    checkPassword
);


/* Enterキー */

passwordInput.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter"
        ) {

            checkPassword();

        }

    }
);

</script>

<script src="script.js"></script>
