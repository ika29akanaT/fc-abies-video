<!DOCTYPE html>
<html lang="ja">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FC Abies VIDEO LIBRARY</title>

<!-- ==================================================
     FC Abies サイト情報
================================================== -->

<meta
    name="description"
    content="FC Abies 2026 C Teamの試合動画をまとめた動画ライブラリです。"
>

<meta
    name="theme-color"
    content="#1261d6"
>


<!-- ブラウザアイコン -->

<link
    rel="icon"
    type="image/png"
    href="logo.png"
>


<!-- スマホホーム画面用 -->

<link
    rel="apple-touch-icon"
    href="logo.png"
>


<!-- ==================================================
     LINE・SNS共有用
================================================== -->

<meta
    property="og:type"
    content="https://ika29akanaT.github.io/fc-abies-video/share.jpg"
>

<meta
    property="og:title"
    content="FC Abies C Team 動画ライブラリ"
>

<meta
    property="og:description"
    content="FC Abies 2026 C Teamの試合動画をまとめています。"
>

<meta
    property="og:image"
    content="https://ika29akanaT.github.io/fc-abies-video/logo.png"
>

<link rel="stylesheet" href="style.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">

</head>

<body>

<header class="site-header">

    <div class="header-inner">

        <div class="logo">

            <img
                src="logo.png"
                alt="FC Abies"
                class="team-logo"
            >

            <div class="logo-text">

                <strong>
                    FC Abies
                </strong>

                <span>
                    2026 C Team
                </span>

            </div>

        </div>

    </div>

</header>

</div>

</header>

<div class="logo">

⚽ FC Abies
<span>2026 C Team</span>

</div>

<!-- ==================================================
     動画フィルター
================================================== -->

<div class="video-filter-area">

    <div class="filter-search">

        <input
            type="search"
            id="search"
            placeholder="対戦相手・大会名などを検索..."
            autocomplete="off"
        >

    </div>
    
    <div class="video-filters">

        <select id="categoryFilter">

            <option value="">
                すべての大会
            </option>

        </select>


        <select id="monthFilter">

            <option value="">
                すべての年月
            </option>

        </select>


        <button
            id="clearFilters"
            type="button"
        >
            クリア
        </button>

    </div>

</div>

</header>

<main>

<section class="hero">

    <div class="hero-content">

        <div class="hero-badge">
            2026 SEASON
        </div>

        <h1>
            FC ABIES
        </h1>

        <div class="hero-title">
            VIDEO LIBRARY
        </div>

        <p>
            2026 C Team 試合動画
        </p>

    </div>

</section>
    
<section>

<h2>

最新動画

</h2>

<div id="latestVideo">

</div>

</section>

<section>

<h2>
    試合動画
    <span class="section-subtitle">
        MATCH VIDEOS
    </span>
</h2>

<div id="videoList" class="grid">

</div>

</section>

</main>

<footer>

    <div class="footer-logo">
        FC ABIES
    </div>

    <div class="footer-team">
        2026 C TEAM
    </div>

    <div class="footer-title">
        VIDEO LIBRARY
    </div>

    <div class="footer-copy">
        © FC Abies
    </div>

</footer>

<!-- ==================================================
     YouTube動画再生モーダル
================================================== -->

<div
    id="videoModal"
    class="video-modal"
    onclick="closeVideo()"
>

    <div
        class="video-modal-content"
        onclick="event.stopPropagation()"
    >

        <button
            class="video-close"
            onclick="closeVideo()"
            aria-label="動画を閉じる"
        >
            ×
        </button>

        <div class="video-player">

            <iframe
                id="youtubePlayer"
                src=""
                title="FC Abies 試合動画"
                frameborder="0"
                allow="
                    autoplay;
                    encrypted-media;
                    picture-in-picture;
                    web-share
                "
                allowfullscreen
            >
            </iframe>

        </div>

    </div>

</div>

<script src="script.js"></script>

</body>

</html>
