<!DOCTYPE html>
<html lang="ja">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FC Abies（2026年 C Team）VIDEO LIBRARY</title>

<link rel="stylesheet" href="style.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">

</head>

<body>

<header>

<div class="logo">

⚽ FC Abies
<span>2026 C Team</span>

</div>

<input
type="text"
id="search"
placeholder="対戦相手・大会名で検索">
     
<!-- ==================================================
     動画フィルター
================================================== -->

<div class="video-filters">

    <select id="categoryFilter">
        <option value="">すべての大会</option>
    </select>

    <select id="monthFilter">
        <option value="">すべての年月</option>
    </select>

    <button
        id="clearFilters"
        type="button"
    >
        クリア
    </button>

</div>

</header>

<main>

<section class="hero">

<h1>VIDEO LIBRARY</h1>

<p>

試合動画をいつでも閲覧できます。<br>
動画は随時追加されます。

</p>

</section>

<section>

<h2>

最新動画

</h2>

<div id="latestVideo">

</div>

</section>

<section>

<h2>

試合動画一覧

</h2>

<div id="videoList" class="grid">

</div>

</section>

</main>

<footer>

©2026 FC Abies

</footer>

<!-- ==================================================
     YouTube動画再生モーダル
================================================== -->

<div
    id="videoModal"
    class="video-modal"
    onclick="closeVideo()"
>

    <div
        class="video-modal-content"
        onclick="event.stopPropagation()"
    >

        <button
            class="video-close"
            onclick="closeVideo()"
            aria-label="動画を閉じる"
        >
            ×
        </button>

        <div class="video-player">

            <iframe
                id="youtubePlayer"
                src=""
                title="FC Abies 試合動画"
                frameborder="0"
                allow="
                    autoplay;
                    encrypted-media;
                    picture-in-picture;
                    web-share
                "
                allowfullscreen
            >
            </iframe>

        </div>

    </div>

</div>

<script src="script.js"></script>

</body>

</html>
